server {
    listen 80;
    listen [::]:80;
    server_name mc3-enhanced.brdanpe.tech;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/mc3-enhanced/current/site;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mc3-enhanced.brdanpe.tech;
    root /var/www/mc3-enhanced/current/site;
    index index.html;
    access_log /var/log/nginx/mc3-enhanced.access.log combined;
    gzip_static on;

    ssl_certificate /etc/letsencrypt/live/mc3-enhanced.brdanpe.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mc3-enhanced.brdanpe.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob: 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' wss://mc3-enhanced.brdanpe.tech; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /healthz { default_type text/plain; return 200 "ok\n"; }
    location = /disc.iso { alias /var/lib/mc3-enhanced/disc.iso; }
    location = /virtual-lan.mjs {
        default_type application/javascript;
        if_modified_since off;
        etag off;
        try_files $uri =404;
    }
    location ^~ /v1/rooms/ {
        proxy_pass http://127.0.0.1:8621;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
    }
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
}
